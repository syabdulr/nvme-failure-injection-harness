[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nvme-failure-injection-harness"
version = "0.1.0"
description = "Inject NVMe faults, then use log pages + completion status for root-cause analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abdul Syed" }]
dependencies = [
    "nvme-logpage-explorer @ git+https://github.com/syabdulr/nvme-logpage-explorer.git",
]

[project.urls]
Repository = "https://github.com/syabdulr/nvme-failure-injection-harness"
"Project 1" = "https://github.com/syabdulr/nvme-logpage-explorer"

[project.scripts]
nvme-harness = "harness:main"

[tool.setuptools]
py-modules = ["harness", "errorlog"]
packages = ["scenarios"]
